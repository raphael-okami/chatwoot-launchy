name: Build Launchy Chatwoot Image

on:
  push:
    branches: [launchy-theme]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.launchy
          push: true
          tags: |
            ghcr.io/raphael-okami/chatwoot-launchy:latest
            ghcr.io/raphael-okami/chatwoot-launchy:v4.14.0-launchy
