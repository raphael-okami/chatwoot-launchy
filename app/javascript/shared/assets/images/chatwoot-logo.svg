<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" role="img" aria-label="Launchy">
  <title>Launchy</title>

  <!-- Icon: rocket/launch symbol in #B5FF2C -->
  <polygon points="20,4 30,18 25,18 25,36 15,36 15,18 10,18" fill="#B5FF2C"/>
  <rect x="15" y="36" width="4" height="7" rx="1" fill="#B5FF2C" opacity="0.75"/>
  <rect x="21" y="36" width="4" height="5" rx="1" fill="#B5FF2C" opacity="0.5"/>
  <rect x="1"  y="17" width="6" height="2" rx="1" fill="#B5FF2C" opacity="0.5"/>
  <rect x="0"  y="21" width="8" height="2" rx="1" fill="#B5FF2C" opacity="0.35"/>
  <rect x="1"  y="25" width="6" height="2" rx="1" fill="#B5FF2C" opacity="0.2"/>

  <!-- Wordmark: LAUNCHY in dark color for light backgrounds -->
  <text
    x="44"
    y="34"
    font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-weight="700"
    font-size="22"
    letter-spacing="-0.5"
    fill="#0D0D0D"
  >LAUNCHY</text>
  <!-- Accent square -->
  <rect x="222" y="24" width="8" height="8" fill="#B5FF2C"/>
</svg>
